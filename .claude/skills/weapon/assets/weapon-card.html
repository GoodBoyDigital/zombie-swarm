<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="/sdk.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 14px; background: #1c1a17; color: #eee6d0; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .top .msg { color: #9a9282; flex: 1 1 160px; }
  button, select { font: inherit; padding: 6px 10px; border: 2px solid #0d0b09; border-radius: 3px; background: #3a3632; color: #eee6d0; cursor: pointer; }
  button.save { background: #ffb347; color: #111; font-weight: bold; }
  button:disabled { opacity: 0.5; cursor: default; }
  .card { background: #262320; border: 2px solid #0d0b09; border-radius: 4px; padding: 12px; display: grid; grid-template-columns: 180px 1fr; gap: 14px; }
  .art { background: #5d5a52; border: 2px solid #0d0b09; border-radius: 3px; min-height: 120px; display: flex; align-items: center; justify-content: center; }
  .art img { image-rendering: pixelated; image-rendering: crisp-edges; width: 160px; }
  h2 { margin: 0 0 4px; font-size: 16px; }
  .meta { color: #9a9282; font-size: 12px; margin-bottom: 8px; }
  .derived { color: #9a9282; font-size: 12px; margin-bottom: 8px; }
  .derived b { color: #eee6d0; font-weight: normal; }
  .stat { display: grid; grid-template-columns: 96px 1fr 70px; gap: 6px; align-items: center; margin: 3px 0; }
  .stat label { color: #bdb4a0; }
  .bar { height: 9px; background: #0d0b09; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #ffb347; transition: width 120ms; }
  input[type=number] { width: 100%; box-sizing: border-box; background: #141210; color: #eee6d0; border: 1px solid #3a3632; border-radius: 2px; padding: 2px 4px; font: inherit; text-align: right; }
  input.dirty { border-color: #ffb347; }
  .pierce { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
  .pierce input[type=number] { width: 44px; }
  .err { color: #e4573f; }
  @media (max-width: 520px) { .card { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="top">
  <select id="pick"></select>
  <button id="save" class="save" disabled>Save to weapons.ts</button>
  <button id="reload">Reload</button>
  <span class="msg" id="msg">Loading…</span>
</div>
<div id="card"></div>
<script>
const WANT = "__WEAPON__";
const PATH = "src/config/weapons.ts";
const FIELDS = ["pellets","spread","spreadBloom","spreadMax","fireInterval","magazine","reloadSeconds","damage","knockback","recoil","pierce","range","shake","tracerWidth","noiseRadius"];
const STEP = { spread: 0.005, spreadBloom: 0.01, spreadMax: 0.01, fireInterval: 0.005, reloadSeconds: 0.1, shake: 0.01, damage: 0.5 };
// Rough upper bounds for the bars so a card is readable on its own.
const SCALE = { pellets: 10, spread: 0.3, spreadBloom: 0.3, spreadMax: 0.3, fireInterval: 1, magazine: 150, reloadSeconds: 4, damage: 12, knockback: 900, recoil: 520, pierce: 5, range: 2400, shake: 1, tracerWidth: 8, noiseRadius: 800 };
let file = null, weapons = [], current = null;
const msg = (t, err) => { const m = document.getElementById("msg"); m.textContent = t; m.className = "msg" + (err ? " err" : ""); };

function parse(content) {
  const body = content.slice(content.indexOf("export const WEAPONS = {"));
  const re = /\n  (\w+): \{\n([\s\S]*?)\n  \},/g;
  const out = []; let m;
  while ((m = re.exec(body))) {
    const values = {};
    for (const f of FIELDS) {
      const fm = new RegExp("^    " + f + ": (Infinity|-?[\\d.]+),$", "m").exec(m[2]);
      if (fm) values[f] = fm[1] === "Infinity" ? Infinity : Number(fm[1]);
    }
    const name = (/^    name: "([^"]*)",$/m.exec(m[2]) || [])[1] || m[1];
    const path = (/^      path: "([^"]*)",$/m.exec(m[2]) || [])[1] || "";
    const casing = (/^    casing: (null|"\w+"),$/m.exec(m[2]) || [])[1] || "";
    out.push({ id: m[1], name, path, casing: casing.replace(/"/g, ""), values, original: { ...values } });
  }
  return out;
}

function serialize(content) {
  const start = content.indexOf("export const WEAPONS = {");
  let head = content.slice(0, start), body = content.slice(start);
  for (const w of weapons) {
    const re = new RegExp("(\\n  " + w.id + ": \\{\\n)([\\s\\S]*?)(\\n  \\},)");
    body = body.replace(re, (all, open, inner, close) => {
      for (const f of FIELDS) {
        if (!(f in w.values)) continue;
        const v = w.values[f];
        const text = v === Infinity ? "Infinity" : String(+v.toFixed(4));
        inner = inner.replace(new RegExp("^(    " + f + ": )(Infinity|-?[\\d.]+),$", "m"), "$1" + text + ",");
      }
      return open + inner + close;
    });
  }
  return head + body;
}

const fmt = v => v === Infinity ? "∞" : v >= 100 ? Math.round(v) : v >= 10 ? +v.toFixed(1) : +v.toFixed(3);

function render() {
  const pick = document.getElementById("pick");
  pick.innerHTML = weapons.map(w => `<option value="${w.id}" ${w.id === current ? "selected" : ""}>${w.name}</option>`).join("");
  const w = weapons.find(x => x.id === current);
  const card = document.getElementById("card");
  if (!w) { card.innerHTML = `<div class="err">No weapon "${current}" in ${PATH}. Ids: ${weapons.map(x => x.id).join(", ")}</div>`; return; }
  const v = w.values;
  const perShot = v.damage * v.pellets, burst = perShot / v.fireInterval;
  const magTime = v.magazine * v.fireInterval, sustained = (v.magazine * perShot) / (magTime + v.reloadSeconds);
  const art = w.path ? `<img src="${playbot.fileUrl("public" + w.path)}" alt="${w.name}">` : "no sprite";
  let rows = "";
  for (const f of FIELDS) {
    if (!(f in v)) continue;
    const val = v[f];
    const pct = val === Infinity ? 100 : Math.min(100, (val / SCALE[f]) * 100);
    const dirty = val !== w.original[f] ? " dirty" : "";
    const ctl = f === "pierce"
      ? `<div class="pierce"><label><input type="checkbox" data-f="pierce" data-inf="1" ${val === Infinity ? "checked" : ""}> all</label><input type="number" min="1" step="1" class="${dirty}" data-f="pierce" value="${val === Infinity ? 1 : val}" ${val === Infinity ? "disabled" : ""}></div>`
      : `<input type="number" min="0" step="${STEP[f] || 1}" class="${dirty}" data-f="${f}" value="${+val.toFixed(4)}">`;
    rows += `<div class="stat"><label>${f}</label><div class="bar"><i style="width:${pct.toFixed(0)}%"></i></div>${ctl}</div>`;
  }
  card.innerHTML = `<div class="card"><div><div class="art">${art}</div></div><div>
    <h2>${w.name}</h2>
    <div class="meta">${w.id} · ${v.pellets} pellet${v.pellets > 1 ? "s" : ""} · ${v.pierce === Infinity ? "pierces all" : v.pierce > 1 ? "pierces " + v.pierce : "stops at first"} · ${w.casing ? w.casing + " shell" : "no shell"}</div>
    <div class="derived">burst <b>${fmt(burst)}</b> dps · sustained <b>${fmt(sustained)}</b> dps · <b>${fmt(perShot)}</b>/shot · mag lasts <b>${fmt(magTime)}</b>s</div>
    ${rows}</div></div>`;
  document.getElementById("save").disabled = !weapons.some(x => FIELDS.some(f => x.values[f] !== x.original[f]));
}

document.getElementById("card").addEventListener("input", (e) => {
  const el = e.target, w = weapons.find(x => x.id === current);
  if (!w || !el.dataset.f) return;
  if (el.dataset.inf) w.values.pierce = el.checked ? Infinity : 1;
  else if (el.type === "number") { const n = Number(el.value); if (!Number.isNaN(n)) w.values[el.dataset.f] = n; }
  render();
});
document.getElementById("pick").onchange = (e) => { current = e.target.value; render(); };

async function load() {
  try {
    const r = await playbot.readFile({ path: PATH });
    file = { content: r.content, mtimeMs: r.mtimeMs };
    weapons = parse(r.content);
    if (!current) current = WANT && weapons.some(w => w.id === WANT) ? WANT : (WANT ? WANT : weapons[0]?.id);
    render();
    msg(`${PATH} · ${weapons.length} weapons`);
  } catch (err) { msg("Could not read " + PATH + ": " + (err.message || err), true); }
}
document.getElementById("reload").onclick = load;
document.getElementById("save").onclick = async () => {
  try {
    const content = serialize(file.content);
    const r = await playbot.writeFile({ path: PATH, content, expectedMtimeMs: file.mtimeMs });
    file = { content, mtimeMs: r.mtimeMs };
    for (const w of weapons) w.original = { ...w.values };
    render();
    msg("Saved. Main build hot-reloads it.");
  } catch (err) { msg("Save refused: " + (err.message || err) + ". Press Reload and redo the edit.", true); }
};
load();
</script>
</body>
</html>
