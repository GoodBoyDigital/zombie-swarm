<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="/sdk.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 12px; background: #1c1a17; color: #eee6d0; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .msg { color: #9a9282; font-size: 11px; margin: 6px 0; }
  button, select { font: inherit; padding: 6px 10px; border: 2px solid #0d0b09; border-radius: 3px; background: #3a3632; color: #eee6d0; cursor: pointer; }
  button.save { background: #ffb347; color: #111; font-weight: bold; }
  button:disabled { opacity: 0.5; cursor: default; }
  .card { background: #262320; border: 2px solid #0d0b09; border-radius: 4px; padding: 10px; }
  .overview { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: center; margin-bottom: 10px; }
  .art { background: #5d5a52; border: 2px solid #0d0b09; border-radius: 3px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
  .art img { image-rendering: pixelated; image-rendering: crisp-edges; width: 100px; max-height: 80px; object-fit: contain; }
  h2 { margin: 0 0 4px; font-size: 16px; }
  .meta { color: #9a9282; font-size: 12px; margin-bottom: 8px; }
  .derived { color: #9a9282; font-size: 12px; margin-bottom: 8px; }
  .derived b { color: #eee6d0; font-weight: normal; }
  .properties { max-height: 230px; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; padding-right: 6px; }
  .stat { display: grid; grid-template-columns: 108px minmax(72px, 1fr) 108px; gap: 8px; align-items: center; min-height: 30px; }
  .stat label { color: #bdb4a0; font-size: 12px; }
  .bar { appearance: none; width: 100%; min-width: 0; height: 28px; margin: 0; background: transparent; cursor: ew-resize; --fill: 0%; }
  .bar::-webkit-slider-runnable-track { height: 8px; border-radius: 3px; background: linear-gradient(to right, #ffb347 var(--fill), #0d0b09 var(--fill)); }
  .bar::-moz-range-track { height: 8px; border-radius: 3px; background: linear-gradient(to right, #ffb347 var(--fill), #0d0b09 var(--fill)); }
  .bar::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; margin-top: -3px; border: 2px solid #0d0b09; border-radius: 50%; background: #ffcf86; }
  .bar::-moz-range-thumb { width: 10px; height: 10px; border: 2px solid #0d0b09; border-radius: 50%; background: #ffcf86; }
  .bar:focus-visible { outline: 2px solid #ffb347; outline-offset: 2px; }
  .bar:disabled { opacity: 0.5; cursor: default; }
  input[type=number] { width: 100%; min-width: 0; box-sizing: border-box; background: #141210; color: #eee6d0; border: 1px solid #3a3632; border-radius: 2px; padding: 3px 4px; font: inherit; text-align: right; }
  input.dirty { border-color: #ffb347; }
  .value { display: flex; gap: 4px; align-items: center; }
  .unlimited { display: flex; align-items: center; white-space: nowrap; }
  .infinite-bar { color: #ffb347; text-align: center; border: 1px solid #5b472b; border-radius: 3px; background: #332b20; font-size: 12px; }
  .infinite-value { color: #ffcf86; text-align: right; font-size: 20px; padding-right: 4px; }
  .hint { margin: 0 0 6px; color: #9a9282; font-size: 11px; }
  .err { color: #e4573f; }
  @media (max-width: 380px) { .stat { grid-template-columns: minmax(72px, 1fr) 108px; } .stat > label { grid-column: 1 / -1; } .overview { grid-template-columns: 80px minmax(0, 1fr); } .art img { width: 72px; } }
</style>
</head>
<body>
<div class="top">
  <select id="pick" aria-label="Weapon"></select>
  <button id="save" class="save" disabled>Save to weapons.ts</button>
  <button id="reload">Reload</button>
</div>
<div class="msg" id="msg" role="status">Loading…</div>
<div id="card"></div>
<script>
const WANT = new URLSearchParams(location.search).get('weapon') ?? '';
const PATH = "src/config/weapons.ts";
const FIELDS = ["magazine","magazines","reloadSeconds","pellets","spread","spreadBloom","spreadMax","fireInterval","damage","knockback","recoil","cameraKick","gunKick","pierce","range","shake","tracerWidth","noiseRadius"];
const STEP = { spread: 0.005, spreadBloom: 0.01, spreadMax: 0.005, fireInterval: 0.005, reloadSeconds: 0.01, shake: 0.01, damage: 0.5, cameraKick: 0.5, gunKick: 0.5 };
const MIN = { pellets: 1, fireInterval: 0.005, magazine: 1, pierce: 1 };
// Slider bounds expand for larger existing or typed values.
const SCALE = { pellets: 10, spread: 0.5, spreadBloom: 0.6, spreadMax: 0.5, fireInterval: 1, magazine: 150, magazines: 8, reloadSeconds: 4, damage: 12, knockback: 900, recoil: 600, cameraKick: 12, gunKick: 14, pierce: 5, range: 2400, shake: 1, tracerWidth: 8, noiseRadius: 800 };
let file = null, weapons = [], current = null;
const msg = (t, err) => { const m = document.getElementById("msg"); m.textContent = t; m.className = "msg" + (err ? " err" : ""); };

function parse(content) {
  const body = content.slice(content.indexOf("export const WEAPONS = {"));
  const re = /\n  (\w+): \{\n([\s\S]*?)\n  \},/g;
  const out = []; let m;
  while ((m = re.exec(body))) {
    const values = {};
    for (const f of FIELDS) {
      const fm = new RegExp("^    " + f + ": (Infinity|-?[\\d.]+),$", "m").exec(m[2]);
      if (fm) values[f] = fm[1] === "Infinity" ? Infinity : Number(fm[1]);
    }
    const name = (/^    name: "([^"]*)",$/m.exec(m[2]) || [])[1] || m[1];
    const path = (/^      path: "([^"]*)",$/m.exec(m[2]) || [])[1] || "";
    const casing = (/^    casing: (null|"\w+"),$/m.exec(m[2]) || [])[1] || "";
    out.push({ id: m[1], name, path, casing: casing.replace(/"/g, ""), values, original: { ...values } });
  }
  return out;
}

function serialize(content) {
  const start = content.indexOf("export const WEAPONS = {");
  let head = content.slice(0, start), body = content.slice(start);
  for (const w of weapons) {
    const re = new RegExp("(\\n  " + w.id + ": \\{\\n)([\\s\\S]*?)(\\n  \\},)");
    body = body.replace(re, (all, open, inner, close) => {
      for (const f of FIELDS) {
        if (!(f in w.values)) continue;
        const v = w.values[f];
        const text = v === Infinity ? "Infinity" : String(+v.toFixed(4));
        inner = inner.replace(new RegExp("^(    " + f + ": )(Infinity|-?[\\d.]+),$", "m"), "$1" + text + ",");
      }
      return open + inner + close;
    });
  }
  return head + body;
}

const fmt = v => v === Infinity ? "∞" : v >= 100 ? Math.round(v) : v >= 10 ? +v.toFixed(1) : +v.toFixed(3);

function render() {
  const pick = document.getElementById("pick");
  pick.innerHTML = weapons.map(w => `<option value="${w.id}" ${w.id === current ? "selected" : ""}>${w.name}</option>`).join("");
  const w = weapons.find(x => x.id === current);
  const card = document.getElementById("card");
  if (!w) { card.innerHTML = `<div class="err">No weapon "${current}" in ${PATH}. Ids: ${weapons.map(x => x.id).join(", ")}</div>`; return; }
  const v = w.values;
  const art = w.path ? `<img src="${playbot.fileUrl(w.path.replace(/^\/sprites\//, "assets/sprites{tps}/"))}" alt="${w.name}">` : "no sprite";
  let rows = "";
  for (const f of FIELDS) {
    if (!(f in v)) continue;
    if (w.id === "pistol" && f === "magazines") {
      rows += `<div class="stat"><label>reloads</label><span class="infinite-bar">Unlimited</span><output class="infinite-value" aria-label="Infinite reloads">∞</output></div>`;
      continue;
    }
    const val = f === "magazines" ? v[f] - 1 : v[f];
    const label = f === "magazines" ? "reloads" : f === "magazine" ? "rounds / mag" : f === "reloadSeconds" ? "reload secs" : f;
    const min = MIN[f] ?? 0, step = STEP[f] || 1;
    const max = Math.max(SCALE[f], Number.isFinite(val) ? val : 0);
    const unlimited = f === "pierce" || f === "magazines"
      ? `<label class="unlimited"><input type="checkbox" data-f="${f}" data-inf="1" aria-label="${label} unlimited">∞</label>` : "";
    rows += `<div class="stat"><label for="value-${f}">${label}</label>
      <input class="bar" type="range" id="bar-${f}" data-f="${f}" min="${min}" max="${max}" step="${step}" aria-label="${label} slider">
      <div class="value"><input type="number" id="value-${f}" data-f="${f}" min="${min}" step="${step}" required aria-label="${label} value">${unlimited}</div></div>`;
  }
  card.innerHTML = `<div class="card"><div class="overview"><div class="art">${art}</div><div>
    <h2>${w.name}</h2>
    <div class="meta" id="meta"></div><div class="derived" id="derived"></div>
    </div></div><p class="hint" id="ammoSummary"></p>
    <div class="properties" aria-label="Weapon properties" tabindex="0">${rows}</div></div>`;
  refresh();
}

// Update in place so dragging, keyboard focus and list scrolling are not interrupted.
function refresh(source) {
  const w = weapons.find(x => x.id === current), v = w.values;
  for (const f of FIELDS) {
    if (!(f in v)) continue;
    if (w.id === "pistol" && f === "magazines") continue;
    const val = f === "magazines" ? v[f] - 1 : v[f], infinite = val === Infinity;
    const bar = document.getElementById(`bar-${f}`), number = document.getElementById(`value-${f}`);
    bar.max = Math.max(Number(bar.max), infinite ? 0 : val);
    bar.disabled = number.disabled = infinite;
    bar.value = infinite ? bar.max : val;
    const pct = infinite ? 100 : (val - Number(bar.min)) / (Number(bar.max) - Number(bar.min)) * 100;
    bar.style.setProperty("--fill", `${Math.min(100, Math.max(0, pct))}%`);
    if (number !== source) number.value = infinite ? "" : +val.toFixed(4);
    number.placeholder = infinite ? "∞" : "";
    number.classList.toggle("dirty", v[f] !== w.original[f]);
    const toggle = document.querySelector(`input[data-f="${f}"][data-inf]`);
    if (toggle) toggle.checked = infinite;
  }
  const perShot = v.damage * v.pellets, burst = perShot / v.fireInterval;
  const magTime = v.magazine * v.fireInterval, sustained = (v.magazine * perShot) / (magTime + v.reloadSeconds);
  const reloads = v.magazines - 1;
  document.getElementById("ammoSummary").textContent = `${v.magazine} rounds/mag · ${fmt(reloads)} reload${reloads === 1 ? "" : "s"} per pickup. Drag or type, then Save.`;
  document.getElementById("meta").textContent = `${w.id} · ${v.pellets} pellet${v.pellets > 1 ? "s" : ""} · ${v.pierce === Infinity ? "pierces all" : v.pierce > 1 ? "pierces " + v.pierce : "stops at first"} · ${w.casing ? w.casing + " shell" : "no shell"}`;
  document.getElementById("derived").innerHTML = `burst <b>${fmt(burst)}</b> dps · sustained <b>${fmt(sustained)}</b> dps · <b>${fmt(perShot)}</b>/shot · mag lasts <b>${fmt(magTime)}</b>s`;
  document.getElementById("save").disabled = !!document.querySelector("input[type=number]:invalid") || !weapons.some(x => FIELDS.some(f => x.values[f] !== x.original[f]));
}

document.getElementById("card").addEventListener("input", (e) => {
  const el = e.target, w = weapons.find(x => x.id === current);
  if (!w || !el.dataset.f) return;
  if (el.dataset.inf) w.values[el.dataset.f] = el.checked ? Infinity : 1;
  else {
    if (!el.validity.valid) { document.getElementById("save").disabled = true; return; }
    w.values[el.dataset.f] = Number(el.value) + (el.dataset.f === "magazines" ? 1 : 0);
  }
  refresh(el);
});
document.getElementById("pick").onchange = (e) => { current = e.target.value; render(); };

async function load() {
  try {
    const r = await playbot.readFile({ path: PATH });
    file = { content: r.content, mtimeMs: r.mtimeMs };
    weapons = parse(r.content);
    if (!current) current = WANT && weapons.some(w => w.id === WANT) ? WANT : (WANT ? WANT : weapons[0]?.id);
    render();
    msg(`${PATH} · ${weapons.length} weapons`);
  } catch (err) { msg("Could not read " + PATH + ": " + (err.message || err), true); }
}
document.getElementById("reload").onclick = load;
document.getElementById("save").onclick = async () => {
  try {
    const content = serialize(file.content);
    const r = await playbot.writeFile({ path: PATH, content, expectedMtimeMs: file.mtimeMs });
    file = { content, mtimeMs: r.mtimeMs };
    for (const w of weapons) w.original = { ...w.values };
    render();
    msg("Saved. Main build hot-reloads it.");
  } catch (err) { msg("Save refused: " + (err.message || err) + ". Press Reload and redo the edit.", true); }
};
load();
</script>
</body>
</html>
